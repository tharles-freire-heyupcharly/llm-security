# CredSim Lab — orquestração na RAIZ do projeto.
# Sobe o app v1 (Dockerfile em lab/app/, backup/referência) em duas instâncias =
# duas "financeiras" (tenants), úteis para as demos de vazamento entre tenants
# da Aula 4, e o app v2 (lab/app_v2/, com motor de IA local via Ollama) — o v2
# roda numa ÚNICA instância: o tenant (financeira-A/B) e o modo de IA
# (mock/local/real) são trocáveis em runtime pela própria UI (não precisa de
# um container por combinação).
#
#   docker compose up --build
#   v1 — financeira A -> http://localhost:8000   financeira B -> http://localhost:8001
#   v2 (financeira A ou B, trocável na UI)        -> http://localhost:8010
#   ollama (motor local do v2)                    -> http://localhost:11434
#
# Variáveis vêm do ambiente ou de um arquivo .env na raiz (veja .env.example).
# Modo real (Claude): defina LLM_MODE=real e ANTHROPIC_API_KEY.
# Modo local (v2, IA open-source real): defina LLM_MODE=local — o serviço
# `ollama` já sobe com o compose; puxe o modelo uma vez com
# `docker compose exec ollama ollama pull ${OLLAMA_MODEL:-llama3.2:3b}`.
services:
  #credsim-a:
  #  build: ./lab/app
  #  ports:
  #    - "8000:8000"
  #  environment:
  #    - LLM_MODE=${LLM_MODE:-mock}
  #    - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
  #    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  #    - TENANT_ID=financeira-A
#
  #credsim-b:
  #  build: ./lab/app
  #  ports:
  #    - "8001:8000"
  #  environment:
  #    - LLM_MODE=${LLM_MODE:-mock}
  #    - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
  #    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
  #    - TENANT_ID=financeira-B

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  credsim-v2:
    build: ./lab/app_v2
    ports:
      - "8010:8000"
    environment:
      - LLM_MODE=${LLM_MODE:-mock}
      - LLM_MODEL=${LLM_MODEL:-claude-opus-4-8}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - TENANT_ID=${TENANT_ID:-financeira-A}
      - DEFENSE_MODEL_ALIGNMENT=${DEFENSE_MODEL_ALIGNMENT:-false}
      - MOCK_THINKING_DELAY=${MOCK_THINKING_DELAY:-1.0}
    depends_on:
      - ollama

volumes:
  ollama_models:
