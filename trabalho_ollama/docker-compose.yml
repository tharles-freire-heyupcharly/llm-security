# Trabalho prático (mestrado) — app didático + Ollama local.
# Independente do docker-compose.yml da raiz do projeto (CredSim v1/v2):
# portas diferentes de propósito para poder rodar os dois ao mesmo tempo.
#
#   cp .env.example .env
#   docker compose up --build
#   App    -> http://localhost:8020
#   Ollama -> http://localhost:11435  (debug/inspeção manual; o app usa a rede interna)
#
# Se o serviço `ollama-pull` falhar ou demorar demais, baixe o modelo manualmente:
#   docker compose exec ollama ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11435:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.2:3b}"]

  app:
    build: ./app
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}
    ports:
      - "8020:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_models:
